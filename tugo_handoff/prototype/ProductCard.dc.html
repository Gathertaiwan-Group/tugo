<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<article style="display:flex;flex-direction:column;gap:12px;min-width:0;font-family:'Noto Sans TC',sans-serif;color:#242622">
  <div style="position:relative">
    <a href="{{ item.href }}" aria-label="{{ item.name }}" style="position:relative;display:block;aspect-ratio:4/5;border-radius:12px;overflow:hidden;background:{{ item.bg1 }}">
      <span style="position:absolute;left:10px;bottom:10px;font:500 10px/1.3 'JetBrains Mono',monospace;letter-spacing:.04em;color:#242622;background:rgba(244,239,229,.9);padding:4px 7px;border-radius:4px">{{ item.img1Label }}</span>
      <div style="position:absolute;inset:0;background:{{ item.bg2 }};opacity:0;transition:opacity .35s ease" style-hover="opacity:1">
        <span style="position:absolute;left:10px;bottom:10px;font:500 10px/1.3 'JetBrains Mono',monospace;letter-spacing:.04em;color:#242622;background:rgba(244,239,229,.9);padding:4px 7px;border-radius:4px">{{ item.img2Label }}</span>
      </div>
      <sc-if value="{{ item.hasBadge }}" hint-placeholder-val="{{ false }}">
        <span style="position:absolute;top:10px;left:10px;font:600 11px/1 'Noto Sans TC',sans-serif;letter-spacing:.06em;padding:6px 9px;border-radius:6px;background:{{ item.badgeBg }};color:{{ item.badgeColor }};border:1px solid {{ item.badgeBorder }}">{{ item.badge }}</span>
      </sc-if>
    </a>
    <button onClick="{{ item.onFav }}" aria-label="{{ item.favLabel }}" aria-pressed="{{ item.faved }}" style="position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:8px;border:none;background:rgba(244,239,229,.92);color:#244A3A;font-size:17px;line-height:1;cursor:pointer;transition:transform .2s" style-hover="transform:scale(1.08)">{{ item.favIcon }}</button>
  </div>
  <div style="display:flex;flex-direction:column;gap:4px;min-width:0">
    <a href="{{ item.artistHref }}" style="font-size:12px;color:#5E6158;letter-spacing:.02em" style-hover="color:#244A3A">{{ item.artistName }}</a>
    <a href="{{ item.href }}" style="font-size:15px;font-weight:500;line-height:1.45;text-wrap:pretty" style-hover="color:#244A3A">{{ item.name }}</a>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px">
      <span style="font:500 14px/1 'JetBrains Mono',monospace">{{ item.priceText }}</span>
      <button onClick="{{ item.onAdd }}" disabled="{{ item.soldout }}" style="height:32px;padding:0 12px;border-radius:8px;border:1px solid {{ item.addBorder }};background:transparent;color:{{ item.addColor }};font:500 12px/1 'Noto Sans TC',sans-serif;cursor:pointer;transition:background .2s,color .2s;white-space:nowrap" style-hover="background:#244A3A;color:#F4EFE5;border-color:#244A3A">{{ item.addLabel }}</button>
    </div>
  </div>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:280,&quot;height&quot;:460},&quot;item&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}"></script>
</body>
</html>
